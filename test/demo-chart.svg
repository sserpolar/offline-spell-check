<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img">
  <!-- Mock product UI for the demo page's figure. Rendered as an <img>, so the
       extension never scans the words in here (an image is a separate document).
       That is on purpose: the amber box in the screenshot must come from the
       <img alt> attribute, not from this text. -->
  <rect width="760" height="280" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="44" fill="#f7f8fa"/>
  <rect x="0" y="43.5" width="760" height="1" fill="#e4e7ec"/>
  <circle cx="22" cy="22" r="6" fill="#3b6fd4"/>
  <text x="38" y="27" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1f2430">Sessions by week</text>
  <rect x="608" y="12" width="60" height="21" rx="4" fill="#eef2fb" stroke="#c9d7f2"/>
  <text x="638" y="27" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#3b6fd4">90 days</text>
  <rect x="676" y="12" width="66" height="21" rx="4" fill="#ffffff" stroke="#dfe3e9"/>
  <text x="709" y="27" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5c6474">Export</text>

  <g stroke="#eef0f3" stroke-width="1">
    <line x1="56" y1="80" x2="734" y2="80"/>
    <line x1="56" y1="120" x2="734" y2="120"/>
    <line x1="56" y1="160" x2="734" y2="160"/>
    <line x1="56" y1="200" x2="734" y2="200"/>
    <line x1="56" y1="240" x2="734" y2="240"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#98a0ad" text-anchor="end">
    <text x="46" y="84">40k</text>
    <text x="46" y="124">30k</text>
    <text x="46" y="164">20k</text>
    <text x="46" y="204">10k</text>
    <text x="46" y="244">0</text>
  </g>

  <path d="M56 240 L56 196 L124 178 L192 186 L260 150 L328 158 L396 122 L464 132 L532 104 L600 96 L668 74 L734 82 L734 240 Z"
        fill="#3b6fd4" fill-opacity="0.10"/>
  <polyline points="56,196 124,178 192,186 260,150 328,158 396,122 464,132 532,104 600,96 668,74 734,82"
            fill="none" stroke="#3b6fd4" stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#3b6fd4" stroke-width="2">
    <circle cx="260" cy="150" r="3.4"/>
    <circle cx="464" cy="132" r="3.4"/>
    <circle cx="668" cy="74" r="3.4"/>
  </g>

  <line x1="56" y1="240" x2="734" y2="240" stroke="#d8dce3" stroke-width="1"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#98a0ad" text-anchor="middle">
    <text x="90" y="258">Jun 2</text>
    <text x="226" y="258">Jun 16</text>
    <text x="362" y="258">Jun 30</text>
    <text x="498" y="258">Jul 14</text>
    <text x="634" y="258">Jul 28</text>
  </g>
</svg>
